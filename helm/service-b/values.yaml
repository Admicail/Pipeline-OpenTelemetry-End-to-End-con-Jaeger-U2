replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/project-54ecee29-e768-42f3-977/otel-registry/service-b
  tag: v1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

env:
  - name: ASPNETCORE_URLS
    value: "http://+:8081"
  - name: ConnectionStrings__DefaultConnection
    value: "Host=postgres-postgresql;Database=appdb;Username=postgres;Password=postgres"
  - name: OTEL_SERVICE_NAME
    value: "service-b"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"
serviceAccount:
  create: false
  name: ""
  ingress:
  enabled: false

autoscaling:
  enabled: false

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
livenessProbe: {}
readinessProbe: {}
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

