apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-postgresql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-postgresql
  template:
    metadata:
      labels:
        app: postgres-postgresql
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: appdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-postgresql
  namespace: default
spec:
  selector:
    app: postgres-postgresql
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
